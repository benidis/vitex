[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitex"
version = "0.1.0"
description = "Reconstruct tutorial videos into structured LaTeX technical documents using Claude (vision + transcript)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Konstantinos Benidis" }]
keywords = ["latex", "video", "transcription", "claude", "bedrock", "tutorial"]

dependencies = [
    # Claude access. The `bedrock` extra pulls in boto3/botocore for SigV4 auth.
    "anthropic[bedrock]>=0.42",
    "yt-dlp>=2024.8.6",
    "Pillow>=10.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Local speech-to-text with word/segment timestamps (no cloud dependency).
whisper = ["faster-whisper>=1.0"]
# AWS Transcribe backend (boto3 already present via anthropic[bedrock]).
aws = ["boto3>=1.34"]
# Text extraction for PDF documents passed with --doc (or install poppler pdftotext).
pdf = ["pypdf>=4"]
dev = ["pytest>=8", "black>=24", "isort>=5", "mypy>=1.8"]

[project.scripts]
vitex = "vitex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vitex"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
